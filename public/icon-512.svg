<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-grad)" filter="url(#glow)" />

  <!-- Code Bracket Left: < -->
  <path d="M190 160 L96 256 L190 352" 
        fill="none" 
        stroke="url(#accent-grad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Code Bracket Right: > -->
  <path d="M322 160 L416 256 L322 352" 
        fill="none" 
        stroke="url(#accent-grad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Center Slash /: / -->
  <path d="M280 140 L232 372" 
        fill="none" 
        stroke="#f8fafc" 
        stroke-width="34" 
        stroke-linecap="round" />

  <!-- Sparkle dot top right -->
  <circle cx="390" cy="120" r="12" fill="#38bdf8" filter="url(#glow)" />
  <!-- Sparkle dot bottom left -->
  <circle cx="120" cy="390" r="8" fill="#a855f7" filter="url(#glow)" />
</svg>
